[build]
  base = "hospital-management"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NODE_ENV = "production"
  # NETLIFY=true is set automatically by Netlify

# =============================================================================
# REQUIRED — set in Netlify Dashboard (Site settings → Environment variables):
#
#   VITE_API_URL = https://hospital-management-system-111.onrender.com
#
# Without this, the build will FAIL with a clear error (not just a warning).
# Vite bakes VITE_API_URL into the JS bundle at build time.
# =============================================================================
