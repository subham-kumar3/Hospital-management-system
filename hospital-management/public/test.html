<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Management System - Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .test-container {
            background: white;
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 600px;
        }
        h1 {
            color: #667eea;
            margin-bottom: 1rem;
            font-size: 2.5rem;
        }
        .status {
            margin: 2rem 0;
            padding: 1.5rem;
            background: #f0f0f0;
            border-radius: 10px;
        }
        .status-item {
            margin: 1rem 0;
            padding: 0.5rem;
            font-size: 1.1rem;
        }
        .success {
            color: #27ae60;
            font-weight: bold;
        }
        .button {
            display: inline-block;
            margin-top: 2rem;
            padding: 1rem 2rem;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            transition: all 0.3s;
        }
        .button:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>🏥 Hospital Management System</h1>
        <p style="color: #666; font-size: 1.2rem;">System Status Check</p>
        
        <div class="status">
            <div class="status-item">
                <span class="success">✅ Frontend Server:</span> Running on port 3000
            </div>
            <div class="status-item">
                <span class="success">✅ Backend Server:</span> Running on port 5001
            </div>
            <div class="status-item">
                <span class="success">✅ MongoDB:</span> Connected
            </div>
        </div>

        <p style="margin-top: 2rem; color: #333; font-size: 1.1rem;">
            Your application is running successfully!<br>
            Click below to access the main application:
        </p>

        <a href="/" class="button">Go to Login Page →</a>
    </div>
</body>
</html>
